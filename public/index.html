          if (n.kind === 0 || !sim.has(n.parent)) {
            sim.delete(k);
            topologyChanged = true;
          } else if (!n.dying) {
            n.dying = true;
            n.dyingTicks = 0;
            topologyChanged = true;
          }
        }
        // every child of a brand-new hub gets the bloom seed; after this pass the hub is settled
        for (const nd of sim.values()) if (nd.kind === 0) nd.fresh = false;

        simEdges = [];
        for (const n of sim.values()) {
          if (n.kind === 1 && sim.has(n.parent)) {
            simEdges.push([n, sim.get(n.parent), K.springHub, n.tr]);
          }
        }
        if (topologyChanged) wake();
        return topologyChanged;
      }

      /** One physics step. Returns true when the layout has settled. */
      function step() {
        const nodes = [...sim.values()];
        const n = nodes.length;
        if (!n) return true;
        const W = world.w;
        const H = world.h;

        for (const a of nodes) {
          a.axf = 0;
          a.ayf = 0;
        }

        // repulsion, clamped so it can never explode
        for (let i = 0; i < n; i++) {
          for (let j = i + 1; j < n; j++) {
            const A = nodes[i];
            const B = nodes[j];
            let dx = B.x - A.x;
            let dy = B.y - A.y;
            let d2 = dx * dx + dy * dy;
            if (d2 < 1e-6) {
              const t = tieBreak(i, j);
              dx = t.x;
              dy = t.y;
              d2 = dx * dx + dy * dy;
            }
            if (A.dying || B.dying) continue;
            const d = Math.sqrt(d2);
            const f = (K.rep * A.q * B.q) / Math.max(d2, K.dmin * K.dmin) / d;
            A.axf -= dx * f;
            A.ayf -= dy * f;
            B.axf += dx * f;
            B.ayf += dy * f;
          }
        }

        // Hooke on real edges only
        for (const [a, b, k, L] of simEdges) {
          const dx = b.x - a.x;
          const dy = b.y - a.y;
          const d = Math.hypot(dx, dy) || 0.01;
          const f = (k * (d - L)) / d;
          a.axf += dx * f;
          a.ayf += dy * f;
          b.axf -= dx * f;
          b.ayf -= dy * f;
        }

        for (const a of nodes) {
          if (a.kind === 0) {
            a.axf += K.anch * (a.ax - a.x);
            a.ayf += K.anch * (a.ay - a.y);
            continue;
          }
          if (a.dying) {
            /*
             * The trip home is KINEMATIC, not a force — and that is deliberate.
             *
             * Two force attempts both failed, each measured in the browser:
             *  1. constant pull (0.16 * distance) pinned the node to the velocity cap on frame 1,
             *     so the flight read as a linear drag at fixed speed;
             *  2. a ramped pull plus a tangential term did curve nicely, but an attractor with no
             *     damping conserves energy: the node shot THROUGH the parent (angle flipped
             *     -43deg -> 135deg), came out the far side and orbited at d 28-39 until the
             *     150-tick failsafe killed it — it never actually arrived.
             * A retracting node has exactly one job, so drive it along a path instead: smoothstep
             * from where it died to the parent, with a tangential swing that peaks mid-flight and
             * unwinds by the end. It eases out AND in, cannot overshoot, and lands exactly on the
             * parent, so the arrival test always fires.
             */
            const p = sim.get(a.parent);
            if (p) {
              if (a.h0x === undefined) {
                a.h0x = a.x - p.x;
                a.h0y = a.y - p.y;
              }
              const u = Math.min(1, (a.dyingTicks || 0) / K.home);
              const e = u * u * (3 - 2 * u);
              const rem = 1 - e;
              const sw = 0.85 * (a.spin || 1) * Math.sin(Math.PI * e);
              const cs = Math.cos(sw);
              const sn = Math.sin(sw);
              a.x = p.x + (a.h0x * cs - a.h0y * sn) * rem;
              a.y = p.y + (a.h0x * sn + a.h0y * cs) * rem;
            }
            a.vx = 0;
            a.vy = 0;
            a.axf = 0;
            a.ayf = 0;
            continue;
          }
          a.axf += K.grav * (W / 2 - a.x);
          a.ayf += K.grav * (H / 2 - a.y);
          const p = sim.get(a.parent);
          if (!p) continue;
          const dx = a.x - p.x;
          const dy = a.y - p.y;
          const d = Math.hypot(dx, dy);
          if (d > 1) {
            // arc-length angular spring — this is what stops the ring rotating forever
            const f = K.arc * wrapPi(a.ta - Math.atan2(dy, dx)) * d;
            a.axf += (-dy / d) * f;
            a.ayf += (dx / d) * f;
          }
        }

        // semi-implicit Euler, dt = 1 FRAME (never elapsed ms — variable dt against 1/d² is
        // exactly how these blow up when a tab stalls)
        for (const a of nodes) {
          a.ox = a.x;
          a.oy = a.y;
          if (a.pinned) {
            a.vx = 0;
            a.vy = 0;
            continue;
          }
          a.vx = (a.vx + a.axf / a.m) * K.damp;
          a.vy = (a.vy + a.ayf / a.m) * K.damp;
          let s = Math.hypot(a.vx, a.vy);
          if (s > K.vmax) {
            a.vx *= K.vmax / s;
            a.vy *= K.vmax / s;
            s = K.vmax;
          }
          if (s < K.vsleep) {
            a.vx = 0;
            a.vy = 0;
          }
          a.x += a.vx;
          a.y += a.vy;
        }

        // positional separation — adds no energy, so it cannot explode
        for (let i = 0; i < n; i++) {
          for (let j = i + 1; j < n; j++) {
            const A = nodes[i];
            const B = nodes[j];
            if (A.dying || B.dying) continue;
            const need = A.r + B.r + K.sep;
            const dx = B.x - A.x;
            const dy = B.y - A.y;
            const d2 = dx * dx + dy * dy;
            if (d2 >= need * need || d2 < 1e-9) continue;
            const d = Math.sqrt(d2);
            const ov = (need - d) * K.relax;
            const iA = A.pinned ? 0 : 1 / A.m;
            const iB = B.pinned ? 0 : 1 / B.m;
            if (iA + iB === 0) continue;
            const w = iA / (iA + iB);
            A.x -= (dx / d) * ov * w;
            A.y -= (dy / d) * ov * w;
            B.x += (dx / d) * ov * (1 - w);
            B.y += (dy / d) * ov * (1 - w);
          }
        }

        let maxDisp = 0;
        for (const a of nodes) {
          if (!Number.isFinite(a.x) || !Number.isFinite(a.y)) {
            // NaN sentinel: reseed to the ideal slot rather than leaving a silently missing node
            const p = sim.get(a.parent);
            a.x = (p ? p.x : W / 2) + (a.tr || 100) * Math.cos(a.ta || 0);
            a.y = (p ? p.y : H / 2) + (a.tr || 100) * Math.sin(a.ta || 0);
            a.vx = 0;
            a.vy = 0;
          }
          let dx = a.x - a.ox;
          let dy = a.y - a.oy;
          const m = Math.hypot(dx, dy);
          if (m > K.dmax) {
            a.x = a.ox + (dx * K.dmax) / m;
            a.y = a.oy + (dy * K.dmax) / m;
          }
          const lo = 18 + a.r;
          if (a.x < lo) {
            a.x = lo;
            a.vx = 0;
          }
          if (a.x > W - lo) {
            a.x = W - lo;
            a.vx = 0;
          }
          if (a.y < lo) {
            a.y = lo;
            a.vy = 0;
          }
          if (a.y > H - lo) {
            a.y = H - lo;
            a.vy = 0;
          }
          maxDisp = Math.max(maxDisp, Math.hypot(a.x - a.ox, a.y - a.oy));
        }

        // reap arrivals: a retracting child is deleted when it reaches the parent, with a frame
        // cap so a pathological case can never leave a ghost on the graph
        let reaped = false;
        let flying = false;
        for (const a of nodes) {
          if (!a.dying) continue;
          a.dyingTicks = (a.dyingTicks || 0) + frameScale;
          const p = sim.get(a.parent);
          const home = p ? Math.hypot(a.x - p.x, a.y - p.y) < p.r * 0.7 : true;
          if (home || a.dyingTicks > 150) {
            sim.delete(a.key);
            reaped = true;
          } else {
            flying = true;
          }
        }
        // A retracting node is moved by assignment, not by velocity, so it contributes 0 to
        // maxDisp — without this the freeze criterion can declare rest and stop the frame loop
        // with a child stranded in mid-air.
        if (reaped) simEdges = simEdges.filter((e) => sim.has(e[0].key) && sim.has(e[1].key));
        if (reaped || flying) {
          quiet = 0;
          return false;
        }

        quiet = maxDisp < K.eps ? quiet + 1 : 0;
        return quiet >= K.hold;
      }

      function tick(ts) {
        raf = 0;
        // Fixed dt with bounded catch-up: a backgrounded tab throttles rAF to ~1Hz, and
        // integrating the real elapsed time would fling every node off screen on return.
        let steps = 1;
        if (lastFrame && ts - lastFrame > 100) steps = Math.min(4, Math.round((ts - lastFrame) / 16));
        /*
         * The force integrator is tuned per FRAME, but the retraction is a timed path, so it must
         * be told how long a frame actually was: measured at 167Hz in a headless browser the trip
         * home finished in 0.30s instead of 0.83s, and a 144Hz display would do the same to a
         * real viewer. When we are catching up with several steps, each step IS one 16.7ms slice,
         * so the scale is 1.
         */
        frameScale = steps > 1 || !lastFrame ? 1 : Math.min(3, Math.max(0.2, (ts - lastFrame) / 16.67));
        lastFrame = ts;
        let settled = false;
        for (let i = 0; i < steps; i++) settled = step();
        paintPositions();
        if (!settled || dragging) raf = requestAnimationFrame(tick);
      }

      // =====================================================================
      // graph rendering — data visuals and position writing are SEPARATE passes
      // =====================================================================

      const gRoot = $("#graph");
      let layers = null;
      /** The zoom/pan window over world coordinates. The sim always works in world space. */
      let view = null;
      let hovered = null;

      function ensureLayers() {
        if (layers) return layers;
        const g = (cls) => {
          const n = svg("g", { class: cls });
          gRoot.append(n);
          return n;
        };
        layers = { wf: g("l-wf"), edges: g("l-edges"), nodes: g("l-nodes"), caps: g("l-caps") };
        return layers;
      }

      function applyView() {
        if (!view) return;
        gRoot.setAttribute("viewBox", `${view.x} ${view.y} ${view.w} ${view.h}`);
      }

      /** Pointer position in world coordinates (accounts for zoom and pan). */
      function toWorld(ev) {
        const r = gRoot.getBoundingClientRect();
        return {
          x: view.x + ((ev.clientX - r.left) / r.width) * view.w,
          y: view.y + ((ev.clientY - r.top) / r.height) * view.h,
        };
      }

      function buildHub() {
        const g = svg("g", { class: "node hub", tabindex: "0", role: "treeitem" });
        const refs = {
          voice: svg("circle", {
            class: "agent-voice-halo",
            r: HUB_R + 12,
            "stroke-width": 2,
            "vector-effect": "non-scaling-stroke",
          }),
          pulse: svg("circle", { class: "pulsering", r: HUB_R, "stroke-width": 2, "vector-effect": "non-scaling-stroke" }),
          ring: svg("circle", { class: "ring", r: HUB_R + 4, "stroke-width": 2, "vector-effect": "non-scaling-stroke" }),
          birth: svg("circle", { class: "birth", r: HUB_R, "stroke-width": 2, "vector-effect": "non-scaling-stroke" }),
          disc: svg("circle", { class: "disc", r: HUB_R, "stroke-width": 2, "vector-effect": "non-scaling-stroke" }),
          errarc: svg("path", { class: "errarc", "stroke-width": 3, "vector-effect": "non-scaling-stroke" }),
          icon: svg("text", { class: "mono", y: -6, style: "font-size:19px" }),
          surface: svg("text", { class: "surface", y: 14 }),
          name: svg("text", { class: "hubname", y: -(HUB_R + 16) }),
          sub: svg("text", { class: "hubsub", y: HUB_R + 20 }),
          doing: svg("text", { class: "hubdoing", y: HUB_R + 34 }),
          errcount: svg("text", { class: "errcount", x: HUB_R + 16, y: -(HUB_R - 2) }),
          title: svg("title"),
        };
        g.append(
          refs.title,
          refs.voice,
          refs.pulse,
          refs.ring,
          refs.birth,
          refs.disc,
          refs.errarc,
          refs.icon,
          refs.surface,
          refs.name,
          refs.sub,
          refs.doing,
          refs.errcount,
        );
        return { g, refs, kind: "hub" };
      }

      function buildKid() {
        const g = svg("g", { class: "node kid", tabindex: "0", role: "treeitem" });
        const refs = {
          pulse: svg("circle", { class: "pulsering", r: 12, "stroke-width": 1.5, "vector-effect": "non-scaling-stroke" }),
          ring: svg("circle", { class: "ring", r: 15, "stroke-width": 2, "vector-effect": "non-scaling-stroke" }),
          disc: svg("circle", { class: "disc", r: 12, "stroke-width": 1.5, "vector-effect": "non-scaling-stroke" }),
          errarc: svg("path", { class: "errarc", "stroke-width": 2.5, "vector-effect": "non-scaling-stroke" }),
          mono: svg("text", { class: "mono" }),
          capG: svg("g", { class: "capg" }),
          cap: svg("text", { class: "cap" }),
          title: svg("title"),
        };
        refs.capG.append(refs.cap);
        g.append(refs.title, refs.pulse, refs.ring, refs.disc, refs.errarc, refs.mono);
        return { g, refs, kind: "kid" };
      }

      function paintHubData(node, a, now) {
        const { refs, g } = node;
        const st = a.status.state;
        g.dataset.state = st;
        g.classList.toggle("run", st === "tool" || st === "thinking" || st === "delegating");
        g.classList.toggle("done", !a.alive);
        g.style.opacity = a.alive ? "" : "0.5";
        refs.disc.setAttribute("fill", "var(--card-2)");
        refs.icon.textContent = STATE_ICON[st] || "•";
        refs.surface.textContent = (a.entrypoint || "").replace(/^claude-/, "").slice(0, 8).toUpperCase();
        refs.surface.setAttribute(
          "fill",
          a.entrypoint === "claude-desktop" ? "#c07cff" : a.entrypoint === "claude-vscode" ? "#4a9eff" : "var(--fg-faint)",
        );
        refs.name.textContent = trunc(a.title || a.name, 26);
        const sub = a.subTotals || {};
        // Only what is RUNNING earns a number here (user directive 2026-09-04): `ลูก 0/69` put a
        // 69 on screen that was almost entirely history, so the one number that mattered — how
        // many are working right now — was the small half of a fraction. The finished ones are
        // still all there, one click away in the panel's "sub-agent ที่จบแล้ว" tab.
        // โทเค็นของ session นี้เอง (ไม่รวมลูก — ยอดของลูกอยู่ในแผง) เป็นยอดสะสมโดยเจตนา ต่างจาก
        // "ลูก N ตัว" ที่เป็นของตอนนี้: ค่าที่จ่ายแล้วไม่ลด และการเห็นมันตอนนี้คือประโยชน์ทั้งหมด
        const ownTok = tokTotal(a.tokens);
        refs.sub.textContent =
          STATE_TH[st] +
          (sub.running ? ` · ลูก ${sub.running} ตัว` : "") +
          (ownTok ? ` · ${fmtTok(ownTok)} tok` : "") +
          (a.alive ? "" : " · จบแล้ว");
        const run = (a.status.running || [])[0];
        if (run) {
          refs.doing.dataset.base = trunc((run.icon || "🔧") + " " + run.tool + " " + (run.label || ""), 44);
          refs.doing.dataset.since = run.startedTs || "";
        } else if ((st === "thinking" || st === "quiet") && a.status.since) {
          // How long it has been thinking is the useful number here — silence is the normal
          // signature of a long think, so the clock is the only thing that moves.
          refs.doing.dataset.base = "💭 คิดอยู่";
          refs.doing.dataset.since = a.status.since;
        } else {
          delete refs.doing.dataset.since;
          delete refs.doing.dataset.base;
          // Never repeat the state line above it. Report the last tool this session actually ran —
          // "what it did last, and how long ago" is exactly what the state word cannot tell you.
          const lastTool = [...(a.events || [])].reverse().find((e) => e.kind === "tool");
          refs.doing.textContent = lastTool
            ? trunc("ล่าสุด " + (lastTool.icon || "🔧") + " " + lastTool.tool + " " + (lastTool.label || ""), 44) +
              " · " +
              fmtAgo(lastTool.ts, now)
            : a.alive
              ? ""
              : "ปิดไปแล้ว · ล่าสุด " + fmtAgo(a.lastTs, now);
        }
        /*
         * The error arc is a QUANTITY, so its length has to mean something. A fixed 1.6rad sweep
         * looked identical for 1 error and for 100 — alarm without information. Scale it against
         * the session's own tool count so the arc shows the failure RATE, floored so a single
         * failure is still visible and capped so it can never look like a full ring.
         */
        const errs = (a.counts && a.counts.errors) || 0;
        const toolsRun = (a.counts && a.counts.tools) || 0;
        if (errs) {
          const rate = toolsRun ? errs / toolsRun : 1;
          const sweep = Math.max(0.35, Math.min(2.4, rate * 12));
          refs.errarc.setAttribute("d", arcPath(0, 0, HUB_R + 9, -Math.PI / 2, -Math.PI / 2 + sweep));
        } else {
          refs.errarc.setAttribute("d", "");
        }
        refs.errcount.textContent = errs ? String(errs) : "";

        // Ripple the parent each time it spawns a child. A CSS animation only restarts if the
        // class is actually removed and re-added across a reflow, hence the void read.
        const n = sim.get(hubKey(a.sessionId));
        if (n && n.rippleAt && n.rippleAt !== node.lastRipple) {
          node.lastRipple = n.rippleAt;
          refs.birth.classList.remove("go");
          void refs.birth.getBoundingClientRect();
          refs.birth.classList.add("go");
          refs.birth.addEventListener("animationend", () => refs.birth.classList.remove("go"), {
            once: true,
          });
        }
        refs.title.textContent =
          `${a.title || a.name}\n${STATE_TH[st]}\n${a.entrypoint} · ${a.kind}\n${a.cwd}` +
          (a.gitBranch ? ` ⑂ ${a.gitBranch}` : "") +
          tokTip("\n\nโทเค็นของ session เอง", a.tokens) +
          tokTip("โทเค็นของ sub-agent ทั้งหมด", sub.tokens) +
          (errs ? `\n\nวงแดง = tool ล้มเหลว ${errs} จาก ${toolsRun} ครั้ง (ของ agent เอง ไม่ใช่ dashboard)` : "");
      }

      function paintKidData(node, sub, siblings) {
        const { refs, g } = node;
        const r = nodeRadius(sub);
        g.classList.toggle("run", !!sub.running);
        g.classList.toggle("done", !sub.running);
        refs.disc.setAttribute("r", r);
        refs.disc.setAttribute("fill", modelColor(sub.modelTag));
        refs.pulse.setAttribute("r", r);
        refs.ring.setAttribute("r", r + 3);
        refs.ring.setAttribute("stroke-width", sub.running ? 2 : 1);
        refs.mono.textContent = sub.modelTag || "??";
        refs.errarc.setAttribute("d", sub.errors ? arcPath(0, 0, r + 7, -Math.PI / 2, -Math.PI / 2 + 1.6) : "");

        const doing = sub.current
          ? (sub.current.icon || "🔧") + " " + sub.current.tool
          : sub.lastTool
            ? "💭 " + sub.lastTool.tool
            : "💭";
        const dense = siblings > 26;
        const capText = dense ? trunc(doing, 16) : trunc(sub.type.replace("workflow-subagent", "wf") + " " + doing, 22);
        refs.cap.dataset.base = capText;
        if (sub.running) {
          refs.cap.dataset.since = (sub.current && sub.current.startedTs) || sub.lastTs || sub.startedTs || "";
        } else {
          delete refs.cap.dataset.since;
          refs.cap.textContent = capText + " · " + fmtDur(sub.durMs);
        }
        refs.cap.dataset.r = r;
        refs.title.textContent =
          `${sub.type} · ${sub.model || "?"}\n${sub.label || ""}\n` +
          (sub.current
            ? `กำลังทำ: ${sub.current.tool} ${sub.current.label || ""}`
            : sub.lastTool
              ? `ล่าสุด: ${sub.lastTool.tool} ${sub.lastTool.label || ""}`
              : "") +
          `\n${sub.tools} tool${sub.errors ? ` · ${sub.errors} พลาด` : ""}` +
          tokTip("\nโทเค็น", sub.tokens) +
          "\nลากได้";
        g.setAttribute(
          "aria-label",
          `${sub.type} ${sub.model} ${sub.label} ${sub.tools} tool ${fmtTok(tokTotal(sub.tokens))} token`,
        );
      }

      /** Create/remove SVG for the current sim membership and refresh data visuals. */
      function paintData(agents, now) {
        const L = ensureLayers();
        const seen = new Set();

        for (const n of sim.values()) {
          seen.add(n.key);
          let node = nodes.get(n.key);
          if (!node) {
            node = n.kind === 0 ? buildHub() : buildKid();
            node.key = n.key;
            nodes.set(n.key, node);
            L.nodes.append(node.g);
            if (node.refs.capG) L.caps.append(node.refs.capG);
            if (n.born) {
              node.g.classList.add("spawn");
              n.born = false;
              // drop the class once the keyframes finish, so the DOM never carries a stale
              // "spawn" marker (it also lets the animation re-trigger if the node is rebuilt)
              node.g.addEventListener("animationend", () => node.g.classList.remove("spawn"), {
                once: true,
              });
            }
            wireNode(node, n);
          }
          node.g.classList.toggle("dying", !!n.dying);
          if (n.kind === 0) paintHubData(node, n.data, now);
          else paintKidData(node, n.data, sim.get(n.parent) ? sim.get(n.parent).degree || 1 : 1);

          const isSel =
            selected &&
            ((n.kind === 0 && selected.kind === "hub" && selected.sessionId === n.sessionId) ||
              (n.kind === 1 && selected.kind === "sub" && selected.agentId === n.data.agentId));
          node.g.classList.toggle("sel", !!isSel);
          const dimming = (selected && selected.kind === "sub") || hovered;
          const related =
            isSel ||
            (hovered && (n.key === hovered || n.parent === hovered || (sim.get(hovered) && sim.get(hovered).parent === n.key)));
          node.g.classList.toggle("dim", !!dimming && !related);
        }

        for (const [key, node] of nodes) {
          if (!seen.has(key)) {
            node.g.remove();
            if (node.refs.capG) node.refs.capG.remove();
            nodes.delete(key);
          }
        }

        // edges follow sim membership
        const seenEdge = new Set();
        for (const [a, b] of simEdges) {
          const key = b.key + ">" + a.key;
          seenEdge.add(key);
          if (!edges.has(key)) {
            const e = svg("line", { class: "edge", "stroke-width": 1, "vector-effect": "non-scaling-stroke" });
            edges.set(key, e);
            L.edges.append(e);
          }
          edges.get(key).classList.toggle("run", !!(a.data && a.data.running));
        }
        for (const [key, e] of edges) {
          if (!seenEdge.has(key)) {
            e.remove();
            edges.delete(key);
          }
        }

        // workflow grouping: a real grouping on disk earns a hull-ish band, but never an
        // intermediate node (that would imply a parentage the data does not have)
        const groups = new Map();
        for (const n of sim.values()) {
          if (n.kind !== 1 || !n.data.workflowId) continue;
          const key = n.sessionId + ":" + n.data.workflowId;
          if (!groups.has(key)) groups.set(key, []);
          groups.get(key).push(n);
        }
        for (const [key, members] of groups) {
          if (members.length < 2) {
            if (wfArcs.has(key)) {
              wfArcs.get(key).remove();
              wfArcs.delete(key);
            }
            continue;
          }
          if (!wfArcs.has(key)) {
            const p = svg("path", { class: "wfarc", "stroke-width": 3, "vector-effect": "non-scaling-stroke" });
            const t = svg("title");
            t.textContent = "workflow " + key.split(":")[1];
            p.append(t);
            wfArcs.set(key, p);
            L.wf.append(p);
          }
          wfArcs.get(key).__members = members;
        }
        for (const [key, p] of wfArcs) {
          if (!groups.has(key) || groups.get(key).length < 2) {
            p.remove();
            wfArcs.delete(key);
          }
        }
      }

      /** Cheap per-frame pass: transforms only. Runs at animation rate. */
      function paintPositions() {
        /*
         * Prune orphans HERE, not only in paintData. A retracting child is reaped by the
         * simulation the instant it reaches its parent, but paintData only runs on a data frame
         * (~700ms apart) — so the SVG outlived its sim node and sat frozen at the parent's edge,
         * measured hanging there for up to 350ms after it had visually landed. That frozen
         * half-faded disc was the whole reason the retraction did not read as "absorbed".
         */
        if (nodes.size > sim.size) {
          for (const [key, node] of nodes) {
            if (sim.has(key)) continue;
            node.g.remove();
            if (node.refs.capG) node.refs.capG.remove();
            nodes.delete(key);
          }
          for (const [key, e] of edges) {
            const [hubK, kidK] = key.split(">");
            if (sim.has(hubK) && sim.has(kidK)) continue;
            e.remove();
            edges.delete(key);
          }
        }
        for (const n of sim.values()) {
          const node = nodes.get(n.key);
          if (!node) continue;
          node.g.setAttribute("transform", `translate(${n.x.toFixed(1)} ${n.y.toFixed(1)})`);
          if (n.kind === 1 && node.refs.capG) {
            node.refs.capG.setAttribute("visibility", n.dying ? "hidden" : "visible");
            const p = sim.get(n.parent);
            const ang = p ? Math.atan2(n.y - p.y, n.x - p.x) : 0;
            const flip = Math.cos(ang) < 0;
            const r = Number(node.refs.cap.dataset.r || 12);
            node.refs.capG.setAttribute(
              "transform",
              `translate(${n.x.toFixed(1)} ${n.y.toFixed(1)}) rotate(${(((flip ? ang + Math.PI : ang) * 180) / Math.PI).toFixed(1)})`,
            );
            node.refs.cap.setAttribute("x", flip ? -(r + 9) : r + 9);
            node.refs.cap.setAttribute("y", 3.5);
            node.refs.cap.setAttribute("text-anchor", flip ? "end" : "start");
          }
        }
        for (const [key, e] of edges) {
          const [hubK, kidK] = key.split(">");
          const h = sim.get(hubK);
          const k = sim.get(kidK);
          if (!h || !k) continue;
          const dx = k.x - h.x;
          const dy = k.y - h.y;
          const d = Math.hypot(dx, dy) || 1;
          const ux = dx / d;
          const uy = dy / d;
          e.setAttribute("x1", (h.x + ux * (h.r + 6)).toFixed(1));
          e.setAttribute("y1", (h.y + uy * (h.r + 6)).toFixed(1));
          e.setAttribute("x2", (k.x - ux * (k.r + 5)).toFixed(1));
          e.setAttribute("y2", (k.y - uy * (k.r + 5)).toFixed(1));
        }
        for (const p of wfArcs.values()) {
          const ms = p.__members;
          if (!ms || ms.length < 2) continue;
          const hub = sim.get(ms[0].parent);
          if (!hub) continue;
          // order members around the hub so the band reads as one group, not a scribble
          const sorted = [...ms].sort(
            (a, b) => Math.atan2(a.y - hub.y, a.x - hub.x) - Math.atan2(b.y - hub.y, b.x - hub.x),
          );
          p.setAttribute(
            "d",
            sorted
              .map((m, i) => {
                const ang = Math.atan2(m.y - hub.y, m.x - hub.x);
                const rad = Math.hypot(m.x - hub.x, m.y - hub.y) + m.r + 12;
                return `${i ? "L" : "M"} ${(hub.x + rad * Math.cos(ang)).toFixed(1)} ${(hub.y + rad * Math.sin(ang)).toFixed(1)}`;
              })
              .join(" "),
          );
        }
      }

      // ---------- interaction: drag a node, pan the background, wheel-zoom ----------

      function wireNode(node, n) {
        node.g.style.cursor = "grab";
        node.g.addEventListener("pointerdown", (ev) => {
          ev.stopPropagation();
          const w = toWorld(ev);
          dragging = { n, dx: n.x - w.x, dy: n.y - w.y, moved: 0 };
          n.pinned = true;
          // Capture is a nicety — it keeps the drag alive if the cursor leaves the disc. It
          // throws when the pointer is already gone (and for a synthetic event with no live
          // pointer), and losing capture must never cost us the drag itself.
          try {
            node.g.setPointerCapture(ev.pointerId);
          } catch {}
          node.g.style.cursor = "grabbing";
          wake();
        });
        node.g.addEventListener("pointermove", (ev) => {
          if (!dragging || dragging.n !== n) return;
          const w = toWorld(ev);
          const nx = w.x + dragging.dx;
          const ny = w.y + dragging.dy;
          dragging.moved += Math.hypot(nx - n.x, ny - n.y);
          n.x = nx;
          n.y = ny;
          n.vx = 0;
          n.vy = 0;
          wake();
        });
        const release = (ev) => {
          if (!dragging || dragging.n !== n) return;
          const wasClick = dragging.moved < 4;
          n.pinned = false;
          node.g.style.cursor = "grab";
          try {
            node.g.releasePointerCapture(ev.pointerId);
          } catch {
            /* already released */
          }
          dragging = null;
          wake();
          // a press that did not move is a click: open the panel
          if (wasClick) {
            if (n.kind === 0) selectHub(n.sessionId);
            else selectSub(n.sessionId, n.data.agentId, n.data);
          }
        };
        node.g.addEventListener("pointerup", release);
        node.g.addEventListener("pointercancel", release);
        node.g.addEventListener("keydown", (e) => {
          if (e.key === "Enter" || e.key === " ") {
            e.preventDefault();
            if (n.kind === 0) selectHub(n.sessionId);
            else selectSub(n.sessionId, n.data.agentId, n.data);
          }
        });
        node.g.addEventListener("pointerenter", () => {
          hovered = n.key;
          if (snapshot.agents) paintData(snapshot.agents, snapshot.nowMs || Date.now());
        });
        node.g.addEventListener("pointerleave", () => {
          if (hovered === n.key) hovered = null;
          if (snapshot.agents) paintData(snapshot.agents, snapshot.nowMs || Date.now());
        });
      }

      let panning = null;
      gRoot.addEventListener("pointerdown", (ev) => {
        if (dragging) return;
        panning = { sx: ev.clientX, sy: ev.clientY, vx: view.x, vy: view.y };
        gRoot.style.cursor = "grabbing";
      });
      gRoot.addEventListener("pointermove", (ev) => {
        if (!panning) return;
        const r = gRoot.getBoundingClientRect();
        view.x = panning.vx - ((ev.clientX - panning.sx) / r.width) * view.w;
        view.y = panning.vy - ((ev.clientY - panning.sy) / r.height) * view.h;
        applyView();
      });
      const endPan = () => {
        panning = null;
        gRoot.style.cursor = "";
      };
      gRoot.addEventListener("pointerup", endPan);
      gRoot.addEventListener("pointerleave", endPan);

      gRoot.addEventListener(
        "wheel",
        (ev) => {
          if (!view) return;
          ev.preventDefault();
          // zoom about the cursor: the world point under the pointer stays put
          const w = toWorld(ev);
          const scale = ev.deltaY > 0 ? 1.12 : 1 / 1.12;
          const minW = world.w * 0.25;
          const maxW = world.w * 3;
          const nw = Math.max(minW, Math.min(maxW, view.w * scale));
          const k = nw / view.w;
          view.w = nw;
          view.h *= k;
          view.x = w.x - (w.x - view.x) * k;
          view.y = w.y - (w.y - view.y) * k;
          applyView();
        },
        { passive: false },
      );

      $("#zoom-reset").addEventListener("click", () => {
        view = { x: 0, y: 0, w: world.w, h: world.h };
        applyView();
        for (const n of sim.values()) n.pinned = false;
        wake();
      });

      // =====================================================================
      // side panel
      // =====================================================================

      function currentAgent() {
        if (!selected) return null;
        return (snapshot.agents || []).find((a) => a.sessionId === selected.sessionId) || null;
      }

      function openPanel() {
        $("#main").classList.add("panel-open");
      }
      function closePanel() {
        selected = null;
        $("#main").classList.remove("panel-open");
        render();
      }

      function selectHub(sessionId, tab) {
        selected = { kind: "hub", sessionId };
        panelTab = tab || "feed";
        feedSeq = 0;
        feedStick = true;
        openPanel();
        render();
      }
      function selectSub(sessionId, agentId, sub) {
        selected = { kind: "sub", sessionId, agentId, label: sub ? sub.type + " · " + sub.label : agentId };
        panelTab = "tools";
        openPanel();
        render();
        loadAgentDetail(sessionId, agentId, "all");
      }

      function renderPanel(now) {
        const a = currentAgent();
        if (!selected || !a) return;
        const isHub = selected.kind === "hub";
        $("#p-title").textContent = isHub ? a.title || a.name : selected.label;

        const tabs = isHub
          ? [
              ["feed", "บทสนทนา"],
              ["waste", "💸 error กิน token"],
              ["meta", "รายละเอียด session"],
              ["subs", "sub-agent ที่จบแล้ว"],
              ["tools", "tool / error / deny"],
            ]
          : [
              ["tools", "tool ทั้งหมด"],
              ["bad", "error / deny"],
              ["meta", "รายละเอียด"],
            ];
        const tabBox = $("#p-tabs");
        if (tabBox.dataset.for !== selected.kind + selected.sessionId + (selected.agentId || "")) {
          tabBox.dataset.for = selected.kind + selected.sessionId + (selected.agentId || "");
          tabBox.textContent = "";
          for (const [id, label] of tabs) {
            const b = el("button", null, label);
            b.dataset.tab = id;
            b.addEventListener("click", () => {
              panelTab = id;
              if (!isHub) loadAgentDetail(selected.sessionId, selected.agentId, id === "bad" ? "bad" : "all");
              else if (id === "tools") loadAgentDetail(selected.sessionId, "", "all");
              render();
            });
            tabBox.append(b);
          }
        }
        // "wasteDetail" คือมุมมองย่อยของแท็บ waste — ให้ปุ่ม waste ยังเป็นปุ่มที่ถูกเลือกอยู่
        const activeTab = panelTab === "wasteDetail" ? "waste" : panelTab;
        for (const b of tabBox.children) b.setAttribute("aria-pressed", String(b.dataset.tab === activeTab));

        if (isHub) {
          $("#p-meta").textContent =
            (a.model || "?") + (a.effort ? " · " + a.effort : "") + " · " + STATE_TH[a.status.state];
        }

        const body = $("#p-body");
        if (panelTab === "feed") renderFeed(body, a, now);
        else if (panelTab === "waste") renderWaste(body, a);
        else if (panelTab === "meta") renderMeta(body, a, now);
        else if (panelTab === "subs") renderFinished(body, a);
        // 'tools' / 'bad' are filled asynchronously by loadAgentDetail
      }

      /**
       * The surface badge, as the VALUE of the `surface` row.
       *
       * It used to be inserted with `dl.after(tag)` — a sibling of the <dl>, while the refresh
       * only cleared the <dl>'s own children. So every snapshot (one per 700ms) left another
       * badge behind: the row grew without limit and pushed a horizontal scrollbar onto the
       * panel. Living inside the <dl> means the same clear that rebuilds the rows removes it,
       * and the badge now sits next to the label it describes.
       */
      function surfaceTag(a) {
        const t = el("span", "tag", (a.entrypoint || "?").replace(/^claude-/, ""));
        t.dataset.surface = a.entrypoint || "";
        return t;
      }

      function renderMeta(body, a, now) {
        if (body.dataset.mode !== "meta") {
          body.textContent = "";
          body.dataset.mode = "meta";
        }
        const sub = selected.kind === "sub" ? (a.subagents || []).find((s) => s.agentId === selected.agentId) : null;
        const rows = sub
          ? [
              ["agentId", sub.agentId],
              ["ชนิด", sub.type],
              ["model", sub.model || "—"],
              ["ชื่องาน", sub.label || "—"],
              ["ที่มาของชื่อ", sub.labelSource || "—"],
              // "จบแล้ว" กับ "ล้มเหลว" ไม่ใช่เรื่องเดียวกัน — `outcome` มาจาก terminal type ที่
              // journal เขียนเอง (`result` / `failed` / …) ไม่ใช่การเดาจากจำนวน error
              ["สถานะ", subStateTh(sub)],
              ["ตัดสินจาก", sub.runningSource || "—"],
              ["tool", String(sub.tools)],
              ["พลาด", String(sub.errors)],
              ...tokRows(sub.tokens),
              ["เริ่ม", sub.startedTs || "—"],
              ["ล่าสุด", fmtAgo(sub.lastTs, now)],
              ["ใช้เวลา", fmtDur(sub.durMs)],
              ["workflow", sub.workflowId || "—"],
              ["ความลึก", String(sub.depth || 1) + (sub.depth > 1 ? " (ลูกของ sub-agent ตัวอื่น)" : " (สายหลักเรียกเอง)")],
              ...(sub.parentAgentId
                ? [
                    [
                      "พ่อ",
                      (() => {
                        const par = (a.subagents || []).find((x) => x.agentId === sub.parentAgentId);
                        return par
                          ? par.type + " · " + (par.label || par.agentId)
                          : sub.parentAgentId + " (ไม่ได้ส่งมาในเฟรมนี้)";
                      })(),
                    ],
                  ]
                : []),
              ["งานที่ได้รับ", sub.task || "—"],
              ["คำตอบ", sub.answer || "—"],
            ]
          : [
              ["session", a.sessionId],
              ["ชื่อ", a.name],
              ["หัวข้อ", a.title || "—"],
              ["surface", surfaceTag(a)],
              ["ชนิด", a.kind],
              ["ยังอยู่", a.alive ? "ใช่" : "จบแล้ว"],
              ["สถานะ", STATE_TH[a.status.state]],
              // what PROVED the turn was over — "—" means nothing has, so the state is a reading
              // of silence rather than a fact (see README: สถานะที่มันบอก)
              ["จบเทิร์นด้วย", a.status.endedBy || "—"],
              ["cwd", a.cwd],
              ["branch", a.gitBranch || "—"],
              ["model", a.model || "—"],
              ["effort", a.effort || "—"],
              ["pid", String(a.pid)],
              ["version", a.version || "—"],
              ["เริ่ม", a.startedAt ? new Date(a.startedAt).toLocaleString() : "—"],
              ["ล่าสุด", fmtAgo(a.lastTs, now)],
              ["tool / error / deny", `${a.counts.tools} / ${a.counts.errors} / ${a.counts.denials}`],
              ...tokRows(a.tokens),
              // ยอดของลูกแยกจากยอดของแม่โดยเจตนา — การรวมกันจะกลบว่าครึ่งไหนของต้นทุนมาจากการ delegate
              ...(a.subTotals && tokTotal(a.subTotals.tokens)
                ? tokRows(a.subTotals.tokens, "โทเค็นของ sub-agent")
                : []),
              ...(a.subTotals && a.subTotals.truncated
                ? [["⚠️ sub-agent เกินเพดาน", `${a.subTotals.onDisk} ตัวบนดิสก์ · ไม่ได้อ่าน ${a.subTotals.truncated} ตัว`]]
                : []),
              ["transcript", a.hasTranscript ? "พบ" : "ไม่พบ"],
            ];
        let dl = body.querySelector(".meta");
        if (!dl) {
          dl = el("dl", "meta");
          body.append(dl);
        }
        dl.textContent = "";
        for (const [k, v] of rows) {
          const dd = el("dd");
          // a row value may be an element (the surface badge) — see surfaceTag
          if (v instanceof Node) dd.append(v);
          else dd.textContent = String(v);
          dl.append(el("dt", null, k), dd);
        }
      }

      function renderEvent(ev, fresh, sessionId) {
        const row = el("div", "ev " + ev.kind + (fresh ? " fresh" : ""));
        const drill = () => {
          if (!ev.hasDetail) return;
          row.style.cursor = "pointer";
          row.title = "กดดูรายละเอียด";
          row.addEventListener("click", () => {
            panelTab = "tools";
            loadAgentDetail(sessionId, "", ev.kind === "tool" ? "tool" : "bad");
          });
        };
        if (ev.kind === "tool") {
          const chip = el("div", "chip " + (!ev.done ? "run" : ev.error ? "fail" : ""));
          chip.append(
            el("span", "t", (ev.icon || "🔧") + " " + ev.tool),
            el("span", "l", ev.label || ""),
            el("span", "d", ev.done ? fmtDur(ev.durMs) : ""),
          );
          row.append(chip);
          drill();
          return row;
        }
        row.append(el("span", "av", EV_AVATAR[ev.kind] || "•"));
        const bubble = el("div", "bubble");
        if (ev.kind === "denied" || ev.kind === "blocked") {
          if (ev.rule) bubble.append(el("span", "badge warn", ev.rule), document.createTextNode(" "));
          if (ev.denyLabel) bubble.append(el("span", "badge calm", ev.denyLabel), document.createTextNode(" "));
        }
        // error: ติดป้ายว่าเป็นความล้มเหลว **ชนิดไหน** และ **ราคาเท่าไหร่** ไว้ที่ตัวมันเลย
        // เพราะ "มี error" อ่านแล้วทำอะไรต่อไม่ได้ แต่ "path ผิด เสีย 184K" อ่านแล้วรู้ว่าต้องแก้อะไร
        if (ev.kind === "error") {
          if (ev.errorLabel) bubble.append(el("span", "badge bad", ev.errorLabel), document.createTextNode(" "));
          if (ev.wastedTokens) {
            bubble.append(el("span", "badge warn", "เสีย " + fmtTok(ev.wastedTokens) + " tok"), document.createTextNode(" "));
          }
        }
        bubble.append(document.createTextNode(ev.text || ""));
        row.append(bubble);
        if (ev.kind !== "prompt" && ev.kind !== "say" && ev.kind !== "thinking") drill();
        return row;
      }

      function renderFeed(body, a, now) {
        let feed = body.querySelector(".feed");
        if (body.dataset.mode !== "feed") {
          body.textContent = "";
          body.dataset.mode = "feed";
          feed = el("div", "feed");
          body.append(feed);
          feedSeq = 0;
          feedStick = true;
          body.addEventListener("scroll", () => {
            feedStick = body.scrollHeight - body.scrollTop - body.clientHeight < 50;
          });
        }
        let appended = false;
        for (const ev of a.events || []) {
          if (ev.i <= feedSeq) continue;
          feed.append(renderEvent(ev, feedSeq > 0, a.sessionId));
          feedSeq = ev.i;
          appended = true;
        }
        while (feed.children.length > 90) feed.firstChild.remove();
        if (appended && feedStick) body.scrollTop = body.scrollHeight;
      }

      /*
       * แท็บ "💸 error กิน token" — ตอบสองคำถามที่ตัวเลข `error: 17` ตอบไม่ได้:
       * **เผาโทเค็นไปกับความล้มเหลวแบบไหน** และ **แก้ยังไง**
       *
       * เรียงตามโทเค็นที่เสีย ไม่ใช่ตามจำนวนครั้ง — เพราะราคาของ error หนึ่งตัวคือ *ขนาด context
       * ตอนนั้น* ไม่ใช่ความหนักของความผิด ⇒ error 1 ครั้งใน session ที่บวมแล้วแพงกว่า error 10 ครั้ง
       * ใน session ที่เพิ่งเริ่ม การเรียงตามจำนวนครั้งจะชี้ไปผิดที่เสมอ
       * (วัดจากเครื่องนี้: เฉลี่ย ~102K/ครั้งในฝั่ง sub-agent แต่ ~490K/ครั้งในสายหลัก)
       *
       * ทุกแถวมีบรรทัด `⇒ วิธีแก้` เพราะหมวดที่ไม่มีทางแก้ก็เป็นแค่การบ่น
       */
      function renderWaste(body, a) {
        const rows = a.errorStats || [];
        const all = tokTotal(a.tokens) + tokTotal((a.subTotals || {}).tokens);
        const wasted = rows.reduce((n, r) => n + r.tokens, 0);
        const times = rows.reduce((n, r) => n + r.n, 0);
        const sig = all + "|" + rows.map((r) => r.id + ":" + r.n + ":" + r.tokens).join("|");
        if (body.dataset.mode === "waste" && body.dataset.sig === sig) return;
        const keep = body.dataset.mode === "waste" ? body.scrollTop : 0;
        body.textContent = "";
        body.dataset.mode = "waste";
        body.dataset.sig = sig;

        if (!rows.length) {
          body.append(el("div", "p-note", "ยังไม่มี error ในเซสชันนี้ — ไม่มีโทเค็นที่เสียไปกับการแก้ตัว 🎉"));
          return;
        }

        body.append(
          el(
            "div",
            "p-note",
            `เสียไปกับ error ${fmtTok(wasted)} จาก ${fmtTok(all)} ที่ใช้ทั้งหมด` +
              (all ? ` (${((wasted / all) * 100).toFixed(1)}%)` : "") +
              ` · ${times} ครั้ง · เฉลี่ย ${fmtTok(Math.round(wasted / Math.max(1, times)))}/ครั้ง` +
              " — นับรวมของ session เองกับของ sub-agent ทุกตัว",
          ),
        );

        const top = rows[0].tokens || 1;
        for (const r of rows) {
          const row = el("div", "wrow");
          row.title = "กดดูรายการ error / deny จริง";
          const top1 = el("div", "top");
          top1.append(
            el("span", "amt", fmtTok(r.tokens)),
            el("span", "cnt", "× " + r.n + " ครั้ง · " + fmtTok(Math.round(r.tokens / Math.max(1, r.n))) + "/ครั้ง"),
            el("span", "lbl", r.label || r.id),
          );
          const share = el("div", "share");
          const fill = el("i");
          // เทียบกับหมวดที่แพงสุด ไม่ใช่กับยอดรวม — เพื่อให้เห็นลำดับความสำคัญได้จากความยาวแถบ
          fill.style.width = Math.max(2, Math.round((r.tokens / top) * 100)) + "%";
          share.append(fill);
          row.append(top1, share);
          if (r.fix && r.fix !== "—") row.append(el("div", "fix", "⇒ " + r.fix));
          row.addEventListener("click", () => {
            // เข้าโหมดรายละเอียด: ตั้ง panelTab เป็นค่าที่ renderPanel ไม่มี branch รองรับ เพื่อให้
            // snapshot ทุก 700ms ไม่มาวาดตารางทับ (แบบเดียวกับแท็บ tools/bad ที่โหลดแบบ async)
            panelTab = "wasteDetail";
            loadWasteDetail(a.sessionId, r.id, r.label);
          });
          body.append(row);
        }
        body.scrollTop = keep;
      }

      function renderFinished(body, a) {
        // DFS ของต้นไม้ แล้วค่อยกรองเอาตัวที่จบ — ทำให้ลูกยังอยู่ใต้พ่อของมันในลิสต์
        const subs = treeOrder(a.subagents || []).filter((s) => !s.running);
        const st = a.subTotals || {};
        /*
         * Rebuild ONLY when the list actually changed. renderPanel runs on every snapshot
         * (~700ms), and a blind `textContent = ""` here threw away the scroll position that
         * often — so a 24-row history could not be read past the first screenful. Same bug the
         * chat feed had. The signature covers what is rendered, so a tool count ticking up on a
         * row still refreshes it.
         */
        const sig =
          (st.done || 0) +
          "|" +
          (st.failed || 0) +
          "|" +
          subs.map((s) => `${s.agentId}:${s.depth || 1}:${s.tools}:${s.errors}:${s.outcome || ""}`).join(",");
        if (body.dataset.mode === "subs" && body.dataset.sig === sig) return;
        const keepScroll = body.dataset.mode === "subs" ? body.scrollTop : 0;
        body.textContent = "";
        body.dataset.mode = "subs";
        body.dataset.sig = sig;
        body.append(
          el(
            "div",
            "p-note",
            // "จบแล้ว N ตัว" เฉย ๆ ทำให้รอบที่ล้มเหลวเกือบทั้งรอบดูเหมือนรอบที่สำเร็จ — วัดได้ว่ามี
            // workflow ที่ล้ม 80 จาก 111 ตัว ⇒ ต้องแยกจำนวนที่ล้มเหลวออกมาให้เห็นตรงหัวรายการ
            `จบแล้ว ${st.done || 0} ตัว` +
              (st.failed ? ` · ⛔ ล้มเหลว ${st.failed} ตัว` : "") +
              (subs.length < (st.done || 0) ? ` (แสดง ${subs.length} ตัวล่าสุด — server จำกัดไว้)` : ""),
          ),
        );
        if (!subs.length) {
          body.append(el("div", "p-note", "ยังไม่มีตัวที่จบ"));
          return;
        }
        for (const s of subs) {
          const row = el("div", "srow");
          const d = s.depth || 1;
          // เยื้องตามความลึก + ขีดต่อให้เห็นว่าเป็นลูกของแถวที่อยู่เหนือขึ้นไป
          if (d > 1) row.style.paddingLeft = (d - 1) * 16 + "px";
          const dot = el("span", "mdot");
          dot.style.background = modelColor(s.modelTag);
          dot.title = "model " + (s.model || "?");
          row.append(dot);
          if (d > 1) {
            const tw = el("span", "tw", "└");
            tw.title = "ลูกของ sub-agent ตัวหนึ่ง (ชั้น " + d + ")";
            row.append(tw);
          }
          row.append(
            el("span", "ty", s.type),
            el("span", "l", s.answer || s.label || s.task || ""),
            el(
              "span",
              "d",
              `${s.tools} tool · ${fmtDur(s.durMs)}` + (tokTotal(s.tokens) ? ` · ${fmtTok(tokTotal(s.tokens))} tok` : ""),
            ),
          );
          if (s.errors) row.append(el("span", "e", s.errors + " พลาด"));
          row.addEventListener("click", () => selectSub(a.sessionId, s.agentId, s));
          row.title = "กดดู tool ทั้งหมดของตัวนี้";
          body.append(row);
        }
        body.scrollTop = keepScroll;
      }

      // ---------- drill-down: tool / error / deny detail from /api/agent ----------

      function kv(label, text, cls) {
        const wrap = el("div", "kv");
        wrap.append(el("div", "k", label));
        const pre = el("pre", cls || null);
        pre.textContent = text;
        wrap.append(pre);
        return wrap;
      }

      function renderPatch(hunks) {
        const wrap = el("div", "kv");
        wrap.append(el("div", "k", "diff"));
        const pre = el("pre", "patch");
        for (const h of hunks) {
          pre.append(el("span", "hdr", `@@ -${h.oldStart},${h.oldLines} +${h.newStart},${h.newLines} @@\n`));
          for (const line of h.lines || []) {
            const cls = line[0] === "+" ? "add" : line[0] === "-" ? "del" : null;
            pre.append(el("span", cls, line + "\n"));
          }
        }
        wrap.append(pre);
        return wrap;
      }

      function buildToolRow(ev) {
        const d = ev.detail || {};
        const failed = ev.kind === "error" || (d.result && d.result.failed);
        const denied = ev.kind === "denied" || ev.kind === "blocked";
        const running = ev.kind === "tool" && !ev.done;
        const row = el("div", "trow" + (denied ? " deny" : failed ? " fail" : running ? " run" : ""));
        const line = el("div", "trow-line");
        const title =
          ev.kind === "tool"
            ? (ev.icon || "🔧") + " " + ev.tool
            : denied
              ? "🚫 " + (ev.denyLabel || "ถูกบล็อก")
              : "❌ " + (ev.tool || "error");
        line.append(el("span", "t", title), el("span", "l", ev.label || ev.text || ""));
        if (ev.rule) line.append(el("span", "badge warn", ev.rule));
        if (ev.exitCode != null) {
          line.append(el("span", "badge bad", "exit " + ev.exitCode + (ev.exitNote ? " · " + ev.exitNote : "")));
        }
        if (running) line.append(el("span", "badge calm", "กำลังทำ"));
        line.append(el("span", "d", ev.done ? fmtDur(ev.durMs) : ""));
        row.append(line);

        const body = el("div", "trow-body");
        for (const r of d.input || []) {
          if (r.kind === "blob") {
            const box = kv(r.key, r.preview + "\n… (ตัดไว้)", "blob");
            box.querySelector(".k").append(el("span", "sz", `${r.bytes.toLocaleString()} B · ${r.lines} บรรทัด`));
            body.append(box);
          } else {
            body.append(kv(r.key, r.text || ""));
          }
        }
        if (d.result) {
          if (d.result.patch) body.append(renderPatch(d.result.patch));
          if (d.result.text) {
            const box = kv(d.result.failed ? "error" : "result", d.result.text, d.result.failed ? "err" : null);
            box.querySelector(".k").append(el("span", "sz", `${(d.result.bytes || 0).toLocaleString()} B`));
            body.append(box);
          }
          if (d.result.persisted) body.append(kv("saved output", d.result.persisted.path));
        }
        if (d.reason) body.append(kv(denied ? "เหตุที่ถูกบล็อก" : "error", d.reason, denied ? "deny" : "err"));
        if (d.deniedTool) body.append(kv("tool ที่ถูกบล็อก", d.deniedTool.tool + " — " + (d.deniedTool.label || "")));
        if (d.command) body.append(kv("hook", d.command));
        if (d.skill) body.append(kv("skill", d.skill));
        if (d.mcpServer) body.append(kv("mcp", d.mcpServer + " · " + (d.mcpTool || "")));
        if (!body.children.length) body.append(el("div", "p-note", "ไม่มีรายละเอียดเพิ่มเติม"));
        row.append(body);
        line.addEventListener("click", () => row.classList.toggle("open"));
        return row;
      }

      let detailToken = 0;
      /**
       * กด 1 หมวดในแท็บ "error กิน token" → เห็น error จริงของหมวดนั้น
       *
       * ดึงจาก `errorLog` ฝั่ง server (ไม่ใช่จาก event feed) เพราะ feed มีแค่ 256KB ท้ายไฟล์
       * ในขณะที่ยอดในตารางนับจากทั้งไฟล์ — ถ้าอ่านจาก feed ตัวเลขกับรายการจะไม่ตรงกัน
       * และของ session จะรวม error ของ sub-agent ทุกตัวมาด้วย (ตรงกับที่ยอดในตารางรวมไว้)
       */
      async function loadWasteDetail(sessionId, kindId, label) {
        const body = $("#p-body");
        const token = ++detailToken;
        body.textContent = "";
        body.dataset.mode = "waste-detail";
        body.dataset.sig = "";
        body.append(el("div", "p-note", "กำลังโหลด…"));
        if (sessionId === "fixture-session") {
          body.textContent = "";
          body.append(el("div", "p-note", "นี่คือข้อมูลทดสอบ (?fixture) — ไม่มี transcript จริงให้เจาะดู"));
          return;
        }
        let data;
        try {
          data = await fetch("/api/agent?s=" + encodeURIComponent(sessionId)).then((r) => r.json());
        } catch (err) {
          if (token === detailToken) {
            body.textContent = "";
            body.append(el("div", "p-note", "โหลดไม่ได้: " + err));
          }
          return;
        }
        if (token !== detailToken) return;
        body.textContent = "";

        const back = el("button", "p-back", "← กลับไปตารางหมวด");
        back.type = "button";
        back.addEventListener("click", () => {
          panelTab = "waste";
          renderPanel(Date.now());
        });
        body.append(back);

        const all = data.errorLog || [];
        const keep = all.filter((e) => e.kind === kindId);
        body.append(
          el(
            "div",
            "p-note",
            label + " — " + keep.length + " รายการ" + (all.length > keep.length ? " (จากทั้งหมด " + all.length + ")" : ""),
          ),
        );
        if (!keep.length) {
          body.append(
            el(
              "div",
              "p-note",
              "ไม่มีรายละเอียดของหมวดนี้เก็บไว้ — errorLog เก็บ " +
                "ย้อนหลังจำกัด (80 รายการต่อ transcript) ยอดในตารางจึงมากกว่าได้",
            ),
          );
          return;
        }
        for (const e of keep) {
          const row = el("div", "wrow");
          row.style.cursor = "default";
          const top = el("div", "top");
          top.append(
            el("span", "amt", e.wasted ? fmtTok(e.wasted) : "—"),
            el("span", "cnt", (e.tool || "?") + (e.from && e.from !== "session" ? " · " + e.from : "")),
            el("span", "lbl", e.ts ? new Date(e.ts).toLocaleString() : ""),
          );
          row.append(top);
          if (e.cmd) row.append(el("div", "etext cmd", "$ " + e.cmd));
          if (e.text) row.append(el("div", "etext", e.text));
          if (e.fix && e.fix !== "—") row.append(el("div", "fix", "⇒ " + e.fix));
          body.append(row);
        }
      }

      async function loadAgentDetail(sessionId, agentId, filter) {
        const body = $("#p-body");
        const token = ++detailToken;
        body.textContent = "";
        body.dataset.mode = "detail";
        body.append(el("div", "p-note", "กำลังโหลด…"));
        // A fixture session has no transcript on disk, so firing the request would only log a
        // doomed 404. Render sample tool/error/deny rows from the same fixture events instead.
        if (sessionId === "fixture-session") {
          body.textContent = "";
          const fx = currentAgent();
          const evs = ((fx && fx.events) || []).filter((e) =>
            filter === "tool"
              ? e.kind === "tool"
              : filter === "bad"
                ? e.kind === "error" || e.kind === "denied" || e.kind === "blocked"
                : e.kind === "tool" || e.kind === "error" || e.kind === "denied" || e.kind === "blocked",
          );
          body.append(
            el("div", "p-note", "นี่คือข้อมูลทดสอบ (?fixture) — ตัวอย่างด้านล่างเป็นข้อมูลจำลอง ไม่ใช่ transcript จริง"),
          );
          if (!evs.length) {
            body.append(el("div", "p-note", "ไม่มีรายการในหมวดนี้"));
            return;
          }
          for (const ev of [...evs].reverse()) body.append(buildToolRow(ev));
          return;
        }
        let data;
        try {
          const qs = "?s=" + encodeURIComponent(sessionId) + (agentId ? "&a=" + encodeURIComponent(agentId) : "");
          data = await fetch("/api/agent" + qs).then((r) => r.json());
        } catch (err) {
          if (token === detailToken) {
            body.textContent = "";
            body.append(el("div", "p-note", "โหลดไม่ได้: " + err));
          }
          return;
        }
        if (token !== detailToken) return;
        body.textContent = "";
        if (data.error) {
          body.append(el("div", "p-note", data.error));
          return;
        }
        if (agentId) {
          $("#p-meta").textContent =
            (data.model || "?") + " · " + data.counts.tools + " tool" + (data.counts.errors ? ` · ${data.counts.errors} พลาด` : "");
        }
        const keep = data.events.filter((e) =>
          filter === "tool"
            ? e.kind === "tool"
            : filter === "bad"
              ? e.kind === "error" || e.kind === "denied" || e.kind === "blocked"
              : true,
        );
        if (!keep.length) {
          body.append(el("div", "p-note", "ไม่มีรายการในหมวดนี้"));
          return;
        }
        for (const ev of [...keep].reverse()) body.append(buildToolRow(ev));
      }

      // =====================================================================
      // AI activity voice — shared event engine, Classic-specific visuals
      // =====================================================================

      const aiVoiceButton = $("#ai-voice");
      const aiVoiceLabel = aiVoiceButton.querySelector(".agent-voice-label");
      const aiVoiceIcon = aiVoiceButton.querySelector(".agent-voice-icon");
      const aiVoiceModeSelect = $("#ai-voice-mode");
      const aiWaitRemindersToggle = $("#beep");
      const aiVoiceBars = [...aiVoiceButton.querySelectorAll(".agent-voice-meter > i")];
      const voiceCueTimers = new WeakMap();
      let activeVoiceHub = null;
      let voiceMeterResetTimer = null;
      let activityVoiceState = {
        mode: "off",
        enabled: false,
        unlocked: false,
        supported: true,
        speaking: false,
        level: 0,
        remindersEnabled: true,
      };

      function visibleVoiceHub(sessionId) {
        if (!sessionId) return null;
        const node = nodes.get(hubKey(sessionId));
        return node && node.kind === "hub" && node.g.isConnected && node.refs.voice ? node : null;
      }

      function setVoiceMeterLevel(rawLevel, active) {
        const level = Math.max(0, Math.min(1, Number(rawLevel) || 0));
        const shape = [0.52, 1, 0.7, 0.88];
        aiVoiceBars.forEach((bar, i) => {

          if (activeVoiceHub !== hub) {

        renderQuota(snapshot.usage, now, staleServer);

              // renderWaste's denominator is tokTotal(a.tokens) + tokTotal(a.subTotals.tokens),
              // so both have to exist or the waste header reads "138K out of 0".
              tokens: { input: 62000, cacheCreate: 410000, cacheRead: 15200000, output: 88000, thinking: 31000, requests: 137, errorRecovery: 46000, partial: false },
              status: { state: "tool", since: new Date(Date.now() - 4000).toISOString(), running: [{ tool: "Bash", icon: "⌨️", label: "fixture", startedTs: new Date(Date.now() - 4000).toISOString() }] },
              subTotals: {
                total: n,
                running: subs.filter((s) => s.running).length,
                done: subs.filter((s) => !s.running).length,
                failed: subs.filter((s) => !s.running && s.errors).length,
                withErrors: subs.filter((s) => s.errors).length,
                runningWithErrors: subs.filter((s) => s.running && s.errors).length,
                errors: 5,
                tools: 500,
                tokens: { input: 122000, cacheCreate: 830000, cacheRead: 31600000, output: 180000, thinking: 61000, requests: 275, errorRecovery: 92000, partial: false },
                models: models_,
                runningModels: models_,
              },
              subagents: subs,
              errorStats: fixtureErrorStats,
              events: fixtureEvents,
              hasTranscript: true,
            },
          ],
        };
      }

      function connect() {
        const fx = new URLSearchParams(location.search).get("fixture");
        if (fx) {
          snapshot = fixture(Math.max(1, Math.min(240, Number(fx) || 45)));
          $("#conn").classList.add("on");
          $("#conn").lastElementChild.textContent = "fixture";
          render();
          activityAudio.ingest(snapshot);
          return;
        }
        const es = new EventSource("/api/stream");
        es.onopen = () => {
          $("#conn").classList.add("on");
          $("#conn").lastElementChild.textContent = "สด";
        };
        es.onmessage = (e) => {
          try {
            snapshot = JSON.parse(e.data);
          } catch {
            return;
          }
          render();
          // Ingest only here, once per fresh SSE frame. render() is also called by search,
          // resize, zoom and panel actions, none of which is a new audible agent event.
          activityAudio.ingest(snapshot);
        };
        es.onerror = () => {
          $("#conn").classList.remove("on");
          $("#conn").lastElementChild.textContent = "หลุด — ต่อใหม่…";
          es.close();
          setTimeout(connect, 1500);
        };
      }
      connect();
    </script>
  </body>
</html>
